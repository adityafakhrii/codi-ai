<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E1742"/>
      <stop offset="60%" stop-color="#120E26"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </radialGradient>

    <!-- Head Gradient -->
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E70FF"/>
      <stop offset="45%" stop-color="#6C4CF1"/>
      <stop offset="100%" stop-color="#4324B2"/>
    </linearGradient>

    <!-- Specular Highlight -->
    <linearGradient id="specularGrad" x1="20%" y1="0%" x2="50%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Visor Gradient -->
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141122"/>
      <stop offset="100%" stop-color="#07060D"/>
    </linearGradient>

    <!-- Eye Glow -->
    <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Drop Shadow -->
    <filter id="botShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#6C4CF1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Circular Outer Frame -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGlow)"/>

  <!-- Subtle Circular Orbit Ring -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="rgba(108, 76, 241, 0.35)" stroke-width="2"/>
  <circle cx="256" cy="270" r="190" fill="none" stroke="#6C4CF1" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="10 14"/>

  <!-- Antenna -->
  <g>
    <!-- Antenna Stem -->
    <path d="M256 160 L256 100" stroke="#8E70FF" stroke-width="8" stroke-linecap="round"/>
    <!-- Antenna Tip Bulb -->
    <circle cx="256" cy="90" r="18" fill="#C9B8FF" filter="url(#eyeGlow)"/>
    <circle cx="256" cy="90" r="9" fill="#FFFFFF"/>
  </g>

  <!-- Ear Nods / Side Pods -->
  <rect x="94" y="235" width="26" height="65" rx="13" fill="#4B2EC7"/>
  <rect x="392" y="235" width="26" height="65" rx="13" fill="#4B2EC7"/>
  <circle cx="107" cy="267" r="6" fill="#C9B8FF"/>
  <circle cx="405" cy="267" r="6" fill="#C9B8FF"/>

  <!-- Main Head Body (Cute Round Shape) -->
  <rect x="112" y="150" width="288" height="236" rx="98" fill="url(#headGrad)" filter="url(#botShadow)"/>

  <!-- Head Top Highlight -->
  <path d="M145 170 C200 155, 312 155, 367 170 C385 175, 375 195, 350 190 C290 178, 222 178, 162 190 C137 195, 127 175, 145 170 Z" fill="url(#specularGrad)"/>

  <!-- Visor Screen (The Iconic Dark Screen) -->
  <rect x="144" y="196" width="224" height="136" rx="58" fill="url(#visorGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="2.5"/>

  <!-- Digital Eyes (Warm Expressive Cyan-White) -->
  <g filter="url(#eyeGlow)">
    <!-- Left Eye -->
    <ellipse cx="206" cy="254" rx="18" ry="24" fill="#7DF9FF"/>
    <ellipse cx="203" cy="247" rx="7" ry="9" fill="#FFFFFF"/>
    <!-- Right Eye -->
    <ellipse cx="306" cy="254" rx="18" ry="24" fill="#7DF9FF"/>
    <ellipse cx="303" cy="247" rx="7" ry="9" fill="#FFFFFF"/>
  </g>

  <!-- Cheerful Mouth / Visor Smile Line -->
  <path d="M238 292 Q256 306 274 292" fill="none" stroke="#C9B8FF" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Rosy Blush Cheeks -->
  <ellipse cx="176" cy="276" rx="12" ry="6" fill="#FF8EC7" opacity="0.45" filter="url(#eyeGlow)"/>
  <ellipse cx="336" cy="276" rx="12" ry="6" fill="#FF8EC7" opacity="0.45" filter="url(#eyeGlow)"/>
</svg>
